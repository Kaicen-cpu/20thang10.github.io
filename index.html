<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp chúc mừng 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;600&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
<style>
@property --c{syntax:'<color>';inherits:false;initial-value:#7a2460}
:root{
  --night:#240a2b; --rose:#ff6f9c; --blush:#ffc4d3; --gold:#f6cd7a; --ivory:#fff3ec;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--ivory);font-family:var(--sans);background:var(--night)}

#glow{position:fixed;left:50%;top:50%;width:90vmax;height:90vmax;margin:-45vmax 0 0 -45vmax;border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent);opacity:.85;will-change:transform;
  transform:translate(var(--x,0),var(--y,0));
  transition:transform 2.4s cubic-bezier(.45,0,.2,1),--c 2.4s ease;
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{scale:1.1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ---------- Scene transitions (opacity + transform only) ---------- */
#stage{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;opacity:0;pointer-events:none}
.scene.in{animation:var(--in) 1.1s var(--ease) .3s both;pointer-events:auto}
.scene.out{animation:var(--out) .7s cubic-bezier(.5,0,.75,0) both}
.fx-pop{--in:popIn;--out:popOut}
.fx-zoom{--in:zoomIn;--out:zoomOut}
.fx-rise{--in:riseIn;--out:riseOut}
.fx-flip{--in:flipIn;--out:flipOut}
.fx-slide{--in:slideIn;--out:slideOut}
.fx-scale{--in:scaleIn;--out:scaleOut}
@keyframes popIn{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@keyframes popOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.6)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes zoomOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.15)}}
@keyframes riseIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes riseOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px)}}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateX(-40deg) translateY(30px)}to{opacity:1;transform:perspective(900px)}}
@keyframes flipOut{from{opacity:1;transform:perspective(900px)}to{opacity:0;transform:perspective(900px) rotateX(40deg) translateY(-30px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-70px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
@keyframes scaleOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.88)}}

/* ---------- Countdown ---------- */
.cd{position:relative;width:min(62vw,250px);aspect-ratio:1;display:grid;place-items:center}
.cd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.cd .bg{stroke:rgba(246,205,122,.18)}
.cd .fg{stroke:var(--gold);stroke-dasharray:283;animation:drain 1s linear forwards}
@keyframes drain{to{stroke-dashoffset:283}}
.num{display:block;font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(100px,32vw,170px);line-height:1;
  color:var(--gold);transform:translate(.06em,-.17em)}

/* ---------- Halo ornament ---------- */
.halo{position:absolute;left:50%;top:50%;width:min(88vw,500px);aspect-ratio:1;margin:calc(min(88vw,500px)/-2) 0 0 calc(min(88vw,500px)/-2);
  border-radius:50%;border:1px solid rgba(246,205,122,.26);animation:spin 36s linear infinite;pointer-events:none}
.halo::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed rgba(255,196,211,.2);animation:spin 50s linear infinite reverse}
.halo::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.inner{position:relative;display:flex;flex-direction:column;align-items:center}

/* ---------- Title ---------- */
.date{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(72px,24vw,120px);line-height:1;color:var(--gold)}
.rule{width:64px;height:2px;margin:18px 0;background:var(--gold);transform:scaleX(0)}
.scene.in .rule{animation:grow 1s 1.4s var(--ease) forwards}
@keyframes grow{to{transform:none}}
h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(24px,7.2vw,42px);line-height:1.3;color:var(--blush)}
h1 span.l{display:block}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(.6em)}
.scene.in .ch{animation:letter .9s var(--ease) forwards;animation-delay:calc(var(--i)*50ms + .6s)}
@keyframes letter{to{opacity:1;transform:none}}

/* ---------- Messages: word by word ---------- */
.msg{position:relative;margin:0;max-width:21ch;font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:clamp(25px,7vw,40px);line-height:1.4;text-wrap:balance;color:var(--ivory);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.wd{display:inline-block;opacity:0;will-change:transform,opacity}
.scene.in .wd{animation:var(--wa) 1.1s var(--ease) forwards;animation-delay:calc(var(--i)*95ms + .55s)}
.wa-rise{--wa:wRise}.wa-drop{--wa:wDrop}.wa-side{--wa:wSide}.wa-pop{--wa:wPop}
@keyframes wRise{from{opacity:0;transform:translateY(.8em)}to{opacity:1;transform:none}}
@keyframes wDrop{from{opacity:0;transform:translateY(-.8em)}to{opacity:1;transform:none}}
@keyframes wSide{from{opacity:0;transform:translateX(var(--dx,-.8em))}to{opacity:1;transform:none}}
.wa-side .wd:nth-child(even){--dx:.8em}
@keyframes wPop{from{opacity:0;transform:scale(.6) rotate(-5deg)}to{opacity:1;transform:none}}
.mrule{width:48px;height:2px;margin:0 0 20px;background:var(--gold);transform:scaleX(0)}
.scene.in .mrule{animation:grow 1s .5s var(--ease) forwards}

/* ---------- Finale ---------- */
.final{margin:0;display:inline-flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap;
  font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(18px,6.2vw,46px);line-height:1.2}
.final .grad{background:linear-gradient(90deg,var(--blush),var(--rose) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
.hb{display:inline-block;font-size:.85em;line-height:1;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}}
.sub{margin:16px 0 0;font-size:15px;font-weight:300;color:var(--blush);opacity:0}
.scene.in .sub{animation:fade 1.4s 1.5s ease forwards}
.btn{margin-top:26px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:11px 22px;border-radius:999px;
  color:var(--ivory);background:transparent;border:1px solid rgba(246,205,122,.55);opacity:0}
.scene.in .btn{animation:fade 1.2s 4.5s ease forwards}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes fade{to{opacity:1}}

#bar{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:4;background:linear-gradient(90deg,var(--rose),var(--gold));
  transform:scaleX(0);transform-origin:left;transition:transform 1.2s cubic-bezier(.45,0,.2,1);margin-bottom:env(safe-area-inset-bottom,0px)}

@media (prefers-reduced-motion:reduce){
  .scene.in,.scene.out{animation-duration:.01s;animation-delay:0s}
  .halo,.halo::before,.msg,.hb,#glow{animation:none}
  .scene.in .wd,.scene.in .ch{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<div id="glow"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main id="stage" aria-live="polite"></main>
<div id="bar"></div>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage=document.getElementById('stage'),glow=document.getElementById('glow'),bar=document.getElementById('bar');

  /* ---------- Particles (time-based so speed stays even) ---------- */
  var cv=document.getElementById('fx'),ctx=cv.getContext('2d'),W=0,H=0,D=Math.min(window.devicePixelRatio||1,2);
  var cols=['#ff7aa2','#ffb3c6','#ffd1c1','#f6cd7a','#ff4f81','#ffe3ea'],hearts=['#ff4f81','#ff6f9c','#ffb3c6','#ff8fb0'];
  var ps=[],rain=false;
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
  addEventListener('resize',resize);resize();
  function rnd(a,b){return a+Math.random()*(b-a)}
  function mk(o){
    return Object.assign({x:rnd(0,W),y:rnd(-H,0),vx:rnd(-.25,.25),vy:rnd(.5,1.3),s:rnd(6,13),r:rnd(0,6.28),vr:rnd(-.025,.025),
      ph:rnd(0,6.28),c:cols[(Math.random()*cols.length)|0],heart:Math.random()<.16,amb:true,life:1,g:0,a:.75},o||{});
  }
  for(var k=0;k<(reduce?8:24);k++){var p0=mk();p0.y=rnd(0,H);ps.push(p0)}
  function burst(x,y,n,heartsOnly){
    for(var k=0;k<n;k++){
      var a=rnd(0,6.28),sp=rnd(2.5,8);
      ps.push(mk({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,g:.1,amb:false,s:rnd(7,14),heart:heartsOnly||Math.random()<.3}));
    }
  }
  function setRain(on){
    rain=on;
    ps=ps.filter(function(p){return !p.rain});
    if(!on)return;
    for(var k=0;k<(reduce?24:60);k++){
      ps.push(mk({rain:true,heart:true,y:rnd(-H*1.6,-10),vy:rnd(.5,1.2),vx:rnd(-.12,.12),s:rnd(7,16),a:rnd(.45,.85),c:hearts[(Math.random()*4)|0]}));
    }
  }
  function drawHeart(s){
    ctx.beginPath();ctx.moveTo(0,s*.35);
    ctx.bezierCurveTo(-s,-s*.3,-s*.5,-s*.95,0,-s*.4);
    ctx.bezierCurveTo(s*.5,-s*.95,s,-s*.3,0,s*.35);ctx.fill();
  }
  function drawPetal(s){
    ctx.beginPath();ctx.moveTo(0,-s);
    ctx.bezierCurveTo(s*.9,-s*.5,s*.7,s*.7,0,s);
    ctx.bezierCurveTo(-s*.7,s*.7,-s*.9,-s*.5,0,-s);ctx.fill();
  }
  var prev=0;
  function frame(t){
    var dt=Math.min((t-prev)/16.67||1,2.5);prev=t;
    ctx.clearRect(0,0,W,H);
    for(var j=ps.length-1;j>=0;j--){
      var p=ps[j];
      p.ph+=.03*dt;p.x+=(p.vx+(p.amb?Math.sin(p.ph)*.45:0))*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.r+=p.vr*dt;
      if(p.amb){if(p.y>H+20){p.y=-20;p.x=rnd(0,W);if(!p.rain)p.heart=rain?true:Math.random()<.16}}
      else{p.vx*=Math.pow(.985,dt);p.life-=.011*dt;if(p.life<=0||p.y>H+30){ps.splice(j,1);continue}}
      ctx.save();ctx.globalAlpha=p.a*(p.amb?1:Math.max(p.life,0));
      ctx.translate(p.x,p.y);
      if(p.heart){ctx.rotate(Math.sin(p.ph)*.25)}else{ctx.rotate(p.r);ctx.scale(.55+Math.abs(Math.sin(p.ph))*.45,1)}
      ctx.fillStyle=p.c;
      p.heart?drawHeart(p.s):drawPetal(p.s);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var last=0;
  addEventListener('pointermove',function(e){
    var n=performance.now();if(n-last<70||reduce)return;last=n;
    ps.push(mk({x:e.clientX,y:e.clientY,vx:rnd(-.8,.8),vy:rnd(-.8,.4),g:.04,amb:false,s:rnd(5,9),life:.8,heart:Math.random()<.4}));
  });

  /* ---------- Scene content ---------- */
  function letters(text,start,cls){
    var i=start;
    var html=text.split(' ').map(function(w){
      return '<span class="w">'+w.split('').map(function(c){return '<span class="ch" style="--i:'+(i++)+'">'+c+'</span>'}).join('')+'</span>';
    }).join(' ');
    return {html:cls?'<span class="'+cls+'">'+html+'</span>':html,next:i};
  }
  function words(t){return t.split(' ').map(function(w,i){return '<span class="wd" style="--i:'+i+'">'+w+'</span>'}).join(' ')}
  function count(n){
    return '<div class="cd"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45"/></svg><span class="num">'+n+'</span></div>';
  }
  function say(t,wa,wide){return '<div class="halo"></div><div class="inner"><div class="mrule"></div><p class="msg wa-'+wa+'">'+words(t)+'</p></div>'}
  function title(){
    var d=letters('20/10',0,'date'),a=letters('Chúc mừng ngày',5,'l'),b=letters('Phụ nữ Việt Nam',5+14,'l');
    return '<div class="halo"></div><div class="inner"><p class="date" aria-hidden="true">'+d.html.replace('<span class="date">','').replace(/<\/span>$/,'')+'</p><div class="rule"></div>'+
      '<h1 aria-label="Chúc mừng ngày Phụ nữ Việt Nam">'+a.html+b.html+'</h1></div>';
  }

  var S=[
    {fx:'pop',d:1000,g:['#7a2460','0','0'],h:count(3)},
    {fx:'pop',d:1000,g:['#8a2a6a','-12vmax','8vmax'],h:count(2)},
    {fx:'pop',d:1000,g:['#a03070','10vmax','-8vmax'],h:count(1)},
    {fx:'zoom',d:4800,g:['#8f2f6e','0','-8vmax'],burst:1,h:title()},
    {fx:'rise',d:4600,g:['#6b1f5b','-14vmax','10vmax'],h:say('Cảm ơn em vì đã luôn dịu dàng bên anh mỗi ngày.','rise')},
    {fx:'flip',d:4600,g:['#9b2f5f','14vmax','-6vmax'],h:say('Cảm ơn em vì nụ cười luôn làm lòng anh thêm ấm áp.','pop')},
    {fx:'slide',d:5000,g:['#7a2a70','-10vmax','-10vmax'],h:say('Mong em luôn được yêu thương, được lắng nghe và được là chính mình.','side')},
    {fx:'scale',d:5000,g:['#b03468','8vmax','10vmax'],h:say('Em xứng đáng với tất cả những điều tốt đẹp nhất.','drop')},
    {fx:'zoom',final:true,g:['#c23a72','0','0'],
      h:'<div class="inner"><p class="final"><span class="hb">❤️</span><span class="grad">Anh yêu em rất nhiều</span><span class="hb">❤️</span></p><p class="sub">Chúc mừng ngày 20/10</p><button class="btn" id="again">Xem lại</button></div>'}
  ];

  /* ---------- Player ---------- */
  var cur=null,timer=null,run=0;
  function show(i,id){
    if(id!==run)return;
    var s=S[i],el=document.createElement('section');
    el.className='scene fx-'+s.fx;el.innerHTML=s.h;
    if(cur){var old=cur;old.classList.remove('in');old.classList.add('out');setTimeout(function(){old.remove()},800)}
    stage.appendChild(el);void el.offsetWidth;el.classList.add('in');cur=el;
    glow.style.setProperty('--c',s.g[0]);glow.style.setProperty('--x',s.g[1]);glow.style.setProperty('--y',s.g[2]);
    bar.style.transform='scaleX('+((i+1)/S.length)+')';
    if(s.burst)setTimeout(function(){if(id===run)burst(W/2,H*.4,70)},500);
    if(s.final){
      setTimeout(function(){if(id===run){burst(W/2,H*.45,70,true);setRain(true)}},600);
      var b=el.querySelector('#again');if(b)b.addEventListener('click',start);
      return;
    }
    timer=setTimeout(function(){show(i+1,id)},s.d);
  }
  function start(){
    clearTimeout(timer);run++;setRain(false);
    if(cur){cur.remove();cur=null}
    bar.style.transform='scaleX(0)';
    show(0,run);
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(start,300)});
})();
</script>
</body>
</html>
